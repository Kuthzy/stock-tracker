services:
  tracker:
    build: .
    restart: unless-stopped      # comes back after crashes and reboots
    env_file: .env
    volumes:
      - ./data:/app/data         # database, logs and Excel exports survive restarts
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"    # health check, only reachable from the server itself
